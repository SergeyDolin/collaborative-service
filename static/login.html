<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Вход — CPS</title>
<link rel="stylesheet" href="/css/theme.css">
<style>
body {
    display:flex; align-items:stretch; min-height:100vh;
    background:var(--paper);
}
.auth-shell {
    display:grid; grid-template-columns:1fr 1fr; min-height:100vh; width:100%;
}
/* Left: brand panel */
.auth-brand {
    background:var(--graphite); color:var(--paper);
    padding:48px; display:flex; flex-direction:column;
    position:relative; overflow:hidden;
}
.auth-brand::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(to right,  rgba(244,241,234,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(244,241,234,.045) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 30%, transparent 80%);
}
.auth-brand-logo {
    display:flex; align-items:center; gap:12px; color:var(--paper);
    font-family:var(--font-mono); font-weight:600; letter-spacing:0.04em;
    border:none;
}
.auth-brand-logo .logo-mark { color:var(--paper); }
.auth-brand-logo .logo-mark .signal-dot { fill:var(--signal); }
.auth-brand-logo .lock-cps { color:var(--paper); border-color:rgba(244,241,234,0.2); }
.auth-brand-logo .tag { color:rgba(244,241,234,0.55); }

.auth-brand-body {
    margin-top:auto; padding-top:64px; max-width:480px; position:relative;
}
.auth-brand-eyebrow {
    font-family:var(--font-mono); font-size:0.7rem; font-weight:500;
    text-transform:uppercase; letter-spacing:0.18em;
    color:var(--signal); margin-bottom:20px;
    display:flex; align-items:center; gap:10px;
}
.auth-brand-eyebrow::before {
    content:''; width:24px; height:1px; background:var(--signal);
}
.auth-brand h1 {
    color:var(--paper); font-size:2.4rem; font-weight:300;
    letter-spacing:-0.02em; line-height:1.15; margin-bottom:18px;
}
.auth-brand h1 em {
    font-style:normal; color:var(--signal);
}
.auth-brand p {
    color:rgba(244,241,234,0.7); font-size:0.95rem;
    line-height:1.55; max-width:420px;
}
.auth-brand-footer {
    margin-top:48px; padding-top:24px;
    border-top:1px solid rgba(244,241,234,0.1);
    font-family:var(--font-mono); font-size:0.7rem;
    color:rgba(244,241,234,0.4);
    letter-spacing:0.05em; text-transform:uppercase;
    display:flex; gap:24px; flex-wrap:wrap;
}

/* Right: form panel */
.auth-form-side {
    padding:48px; display:flex; align-items:center; justify-content:center;
    background:var(--paper); position:relative;
}
.auth-form-side > .auth-theme-row {
    position:absolute; top:24px; right:24px;
}
.auth-card {
    width:100%; max-width:380px;
}
.auth-card h2 {
    font-size:1.6rem; font-weight:600; margin-bottom:6px; letter-spacing:-0.01em;
}
.auth-card .subtitle {
    font-size:0.88rem; color:var(--ink-3); margin-bottom:32px;
    font-family:var(--font-mono); letter-spacing:0.01em;
}
.auth-footer {
    text-align:left; margin-top:28px; padding-top:24px;
    border-top:1px solid var(--paper-edge); font-size:0.85rem; color:var(--ink-3);
    line-height:1.9;
}
.auth-footer a { color:var(--ink); font-weight:500; border-bottom:1px solid var(--paper-edge); }
.auth-footer a:hover { border-bottom-color:var(--graphite); }
.error-message, .success-message {
    padding:11px 14px; border-radius:var(--r-sm); margin-bottom:18px;
    font-size:0.83rem; display:none; font-weight:500;
    font-family:var(--font-mono); letter-spacing:0.01em;
    border:1px solid transparent;
}
.error-message   { background:var(--err-bg); color:var(--err); border-color:var(--err); }
.success-message { background:var(--ok-bg);  color:var(--ok);  border-color:var(--ok); }

@media(max-width:860px){
    .auth-shell { grid-template-columns:1fr; }
    .auth-brand { padding:32px 24px; min-height:240px; }
    .auth-brand h1 { font-size:1.6rem; }
    .auth-form-side { padding:32px 24px; }
}
</style>
</head>
<body>
<div class="auth-shell">
    <aside class="auth-brand">
        <a class="auth-brand-logo logo" href="/">
            <div class="logo-icon"></div>
            <div class="logo-text"></div>
        </a>
        <div class="auth-brand-body">
            <div class="auth-brand-eyebrow">Authorisation · v2</div>
            <h1>Возвращаемся в <em>сеть</em>.</h1>
            <p>Войдите, чтобы загружать наблюдения, обрабатывать их в PPP-AR и подключать устройства к коллаборативной сети.</p>
            <div class="auth-brand-footer">
                <span>WGS-84</span><span>ITRF2014</span><span>RTCM 3.3</span>
            </div>
        </div>
    </aside>
    <section class="auth-form-side">
        <div class="auth-theme-row">
            <button class="theme-toggle" onclick="_toggleTheme()" title="Тёмная тема">☾</button>
        </div>
        <div class="auth-card">
            <h2>Вход в систему</h2>
            <p class="subtitle">// введите логин и пароль</p>
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="login">Логин</label>
                    <input type="text" id="login" name="login" placeholder="Введите логин" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Введите пароль" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Войти</button>
            </form>
            <div class="auth-footer">
                Нет аккаунта? <a href="/register">Зарегистрироваться</a><br>
                <a href="/" style="font-size:0.78rem;color:var(--ink-3);border:none;">← На главную</a>
            </div>
        </div>
    </section>
</div>
<script src="/js/chrome.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
