<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="prepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="procGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#94a3b8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="640" y="42" text-anchor="middle" fill="#0f172a" font-size="26" font-weight="700" letter-spacing="1">
    Конвейер апостериорной обработки
  </text>
  <line x1="15" y1="58" x2="1265" y2="58" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Column header bands -->
  <rect x="15"  y="63" width="280" height="24" rx="6" fill="#1e40af"/>
  <rect x="310" y="63" width="275" height="24" rx="6" fill="#0f766e"/>
  <rect x="600" y="63" width="265" height="24" rx="6" fill="#6d28d9"/>
  <rect x="880" y="63" width="385" height="24" rx="6" fill="#b45309"/>

  <text x="155" y="80" text-anchor="middle" fill="#dbeafe" font-size="13" font-weight="700" letter-spacing="0.5">ВХОДНЫЕ ДАННЫЕ</text>
  <text x="447" y="80" text-anchor="middle" fill="#ccfbf1" font-size="13" font-weight="700" letter-spacing="0.5">ПОДГОТОВКА</text>
  <text x="732" y="80" text-anchor="middle" fill="#ede9fe" font-size="13" font-weight="700" letter-spacing="0.5">ОБРАБОТКА</text>
  <text x="1072" y="80" text-anchor="middle" fill="#fef3c7" font-size="13" font-weight="700" letter-spacing="0.5">РЕЗУЛЬТАТ</text>

  <!-- Vertical dividers -->
  <line x1="300" y1="60" x2="300" y2="708" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="592" y1="60" x2="592" y2="708" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="874" y1="60" x2="874" y2="708" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ═══════════════════════════════════════════════
       COLUMN 1 — INPUT DATA  (x=15, w=280)
  ═══════════════════════════════════════════════ -->

  <!-- Block: Наблюдения  y=92..387 h=296 -->
  <rect x="15" y="92" width="280" height="296" rx="10" fill="url(#inputGrad)" filter="url(#shadow)"/>
  <rect x="15" y="92" width="280" height="40" rx="10" fill="#1e3a8a"/>
  <rect x="15" y="120" width="280" height="12" fill="#1e3a8a"/>
  <text x="155" y="119" text-anchor="middle" fill="#bfdbfe" font-size="20" font-weight="700">Наблюдения</text>
  <text x="28" y="150" fill="#93c5fd" font-size="16">• Файл .rnx / .obs / .crx / .xxd /</text>
  <text x="28" y="168" fill="#93c5fd" font-size="16">• Архив .gz</text>

  <!-- Block: Параметры пользователя  y=404..706 h=303 -->
  <rect x="15" y="404" width="280" height="303" rx="10" fill="url(#inputGrad)" filter="url(#shadow)"/>
  <rect x="15" y="404" width="280" height="40" rx="10" fill="#1e3a8a"/>
  <rect x="15" y="432" width="280" height="12" fill="#1e3a8a"/>
  <text x="155" y="431" text-anchor="middle" fill="#bfdbfe" font-size="20" font-weight="700">Параметры пользователя</text>
  <text x="28" y="462" fill="#93c5fd" font-size="16">• Метод: Single / PPP-AR</text>
  <text x="28" y="481" fill="#93c5fd" font-size="16">• Режим: Статика / Кинематика</text>

  <!-- ═══════════════════════════════════════════════
       COLUMN 2 — PREPARATION  (x=310, w=275)
  ═══════════════════════════════════════════════ -->

  <!-- Block: SNR Маска  y=92..204 h=113 -->
  <rect x="310" y="92" width="275" height="113" rx="10" fill="url(#prepGrad)" filter="url(#shadow)"/>
  <rect x="310" y="92" width="275" height="40" rx="10" fill="#0d9488"/>
  <rect x="310" y="120" width="275" height="12" fill="#0d9488"/>
  <text x="447" y="119" text-anchor="middle" fill="#ccfbf1" font-size="20" font-weight="700">SNR Маска</text>
  <text x="323" y="150" fill="#99f6e4" font-size="13">• Читает комментарии заголовка RINEX</text>
  <text x="323" y="168" fill="#99f6e4" font-size="13">• Диапазоны dBHz → флаг 1–9</text>
  <text x="323" y="186" fill="#99f6e4" font-size="13">• Генерирует маски L1/L2/L5</text>

  <!-- Block: Антенна  y=220..352 h=133 -->
  <rect x="310" y="220" width="275" height="133" rx="10" fill="url(#prepGrad)" filter="url(#shadow)"/>
  <rect x="310" y="220" width="275" height="40" rx="10" fill="#0d9488"/>
  <rect x="310" y="248" width="275" height="12" fill="#0d9488"/>
  <text x="447" y="247" text-anchor="middle" fill="#ccfbf1" font-size="20" font-weight="700">Антенна</text>
  <text x="323" y="278" fill="#99f6e4" font-size="13">• Парсинг "ANT # / TYPE" из RINEX</text>
  <text x="323" y="296" fill="#99f6e4" font-size="13">• Смещения ΔH / ΔE / ΔN из заголовка</text>
  <text x="323" y="314" fill="#99f6e4" font-size="13">• Мобильное устройство: ручной ввод</text>
  <text x="323" y="332" fill="#99f6e4" font-size="13">• Поиск PCV-коррекции в igs20.atx</text>

  <!-- Block: Загрузка файлов  y=368..572 h=205 -->
  <rect x="310" y="368" width="275" height="205" rx="10" fill="url(#prepGrad)" filter="url(#shadow)"/>
  <rect x="310" y="368" width="275" height="40" rx="10" fill="#0d9488"/>
  <rect x="310" y="396" width="275" height="12" fill="#0d9488"/>
  <text x="447" y="395" text-anchor="middle" fill="#ccfbf1" font-size="20" font-weight="700">Загрузка файлов</text>
  <text x="323" y="424" fill="#99f6e4" font-size="13" font-weight="600">Навигационное сообщение:</text>
  <text x="323" y="441" fill="#a7f3d0" font-size="12">  BRDC</text>
  <text x="323" y="457" fill="#99f6e4" font-size="13" font-weight="600">Точные продукты IGS (GPS-неделя):</text>
  <text x="323" y="474" fill="#a7f3d0" font-size="12">  SP3  — точные эфемериды спутников</text>
  <text x="323" y="490" fill="#a7f3d0" font-size="12">  CLK  — точные поправки часов (30s/5s)</text>
  <text x="323" y="506" fill="#a7f3d0" font-size="12">  DCB  — дифф. кодовые задержки</text>
  <text x="323" y="522" fill="#a7f3d0" font-size="12">  ERP  — параметры вращения Земли</text>
  <text x="323" y="538" fill="#a7f3d0" font-size="12">  BIA  — фазовые задержки (для PPP-AR)</text>
  <text x="323" y="562" fill="#6ee7b7" font-size="11" font-style="italic">FTP-over-TLS · .gz → распаковка · кэш</text>

  <!-- Block: BLQ  y=588..706 h=119 -->
  <rect x="310" y="588" width="275" height="119" rx="10" fill="url(#prepGrad)" filter="url(#shadow)"/>
  <rect x="310" y="588" width="275" height="40" rx="10" fill="#0d9488"/>
  <rect x="310" y="616" width="275" height="12" fill="#0d9488"/>
  <text x="447" y="615" text-anchor="middle" fill="#ccfbf1" font-size="19" font-weight="700">BLQ — приливная нагрузка</text>
  <text x="323" y="646" fill="#99f6e4" font-size="13">• generate_blq.py → pyfes (FES2022)</text>
  <text x="323" y="663" fill="#99f6e4" font-size="13">• 11 приливных составляющих (M2,S2…)</text>
  <text x="323" y="680" fill="#99f6e4" font-size="13">• Ампл. + фаза смещений (U/N/E) в мм</text>
  <text x="323" y="697" fill="#99f6e4" font-size="13">• Генерирует BLQ-файл</text>

  <!-- ═══════════════════════════════════════════════
       COLUMN 3 — PROCESSING  (x=600, w=265)
  ═══════════════════════════════════════════════ -->

  <!-- Block: Запуск обработки  y=92..706 h=615 -->
  <rect x="600" y="92" width="265" height="615" rx="10" fill="url(#procGrad)" filter="url(#shadow)"/>
  <rect x="600" y="92" width="265" height="40" rx="10" fill="#6d28d9"/>
  <rect x="600" y="120" width="265" height="12" fill="#6d28d9"/>
  <text x="732" y="119" text-anchor="middle" fill="#ede9fe" font-size="20" font-weight="700">Запуск обработки</text>

  <!-- ═══════════════════════════════════════════════
       COLUMN 4 — OUTPUT  (x=880, w=385)
  ═══════════════════════════════════════════════ -->

  <!-- Block: Решение  y=92..706 h=615 -->
  <rect x="880" y="92" width="385" height="615" rx="10" fill="url(#outGrad)" filter="url(#shadow)"/>
  <rect x="880" y="92" width="385" height="40" rx="10" fill="#b45309"/>
  <rect x="880" y="120" width="385" height="12" fill="#b45309"/>
  <text x="1072" y="119" text-anchor="middle" fill="#fef3c7" font-size="20" font-weight="700">Решение</text>
  <text x="893" y="150" fill="#fde68a" font-size="16">• Координаты в ITRF на эпоху наблюдения</text>
  <text x="893" y="169" fill="#fde68a" font-size="16">• Файл решения (Кинематика)</text>
  <text x="893" y="188" fill="#fde68a" font-size="16">• Возможность преобразования в ГСК-2011</text>
  <text x="893" y="207" fill="#fde68a" font-size="16">• Процент FIX решения | Кол-во спутников</text>

  <!-- Footer -->
  <line x1="15" y1="712" x2="1265" y2="712" stroke="#cbd5e1" stroke-width="1"/>
</svg>
