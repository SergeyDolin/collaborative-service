  <text x="50" y="750" fill="#60a5fa" font-size="11" font-style="italic">Суперпозиция всех 11 волн → комплексная приливная функция смещения земной коры</text>

  <!-- ════════════════════════════════
       RIGHT: BLQ FORMAT
  ════════════════════════════════ -->
  <rect x="730" y="445" width="340" height="315" rx="12" fill="#0a1630" stroke="#1d4ed8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="730" y="445" width="340" height="36" rx="12" fill="#1e40af"/>
  <rect x="730" y="468" width="340" height="13" fill="#1e40af"/>
  <text x="900" y="469" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="700">Формат BLQ-файла</text>

  <rect x="748" y="484" width="304" height="260" rx="6" fill="#060d1a"/>
  <text x="758" y="500" fill="#64748b" font-size="9" font-family="'Courier New', monospace">$$ Ocean loading file</text>
  <text x="758" y="514" fill="#64748b" font-size="9" font-family="'Courier New', monospace">$$ FES2022 · pyfes · Station: RIGA</text>
  <text x="758" y="528" fill="#64748b" font-size="9" font-family="'Courier New', monospace">$$</text>
  <text x="758" y="542" fill="#4ade80" font-size="9" font-family="'Courier New', monospace">  RIGA</text>
  <text x="758" y="556" fill="#60a5fa" font-size="9" font-family="'Courier New', monospace">$$ amp (m): M2   S2   N2   K2   K1   O1</text>
  <text x="758" y="570" fill="#a5b4fc" font-size="9" font-family="'Courier New', monospace">  0.0023 0.0008 0.0005 0.0002 0.0012 0.0008</text>
  <text x="758" y="584" fill="#60a5fa" font-size="9" font-family="'Courier New', monospace">$$ amp (m): P1   Q1   Mf   Mm   Ssa</text>
  <text x="758" y="598" fill="#a5b4fc" font-size="9" font-family="'Courier New', monospace">  0.0004 0.0001 0.0001 0.0001 0.0001</text>
  <text x="758" y="612" fill="#60a5fa" font-size="9" font-family="'Courier New', monospace">$$ phs (deg): M2  S2  N2  K2  K1  O1</text>
  <text x="758" y="626" fill="#a5b4fc" font-size="9" font-family="'Courier New', monospace">   -62.1 -62.3 -61.4 -59.2  57.3  33.4</text>
  <text x="758" y="640" fill="#60a5fa" font-size="9" font-family="'Courier New', monospace">$$ phs (deg): P1  Q1  Mf  Mm  Ssa</text>
  <text x="758" y="654" fill="#a5b4fc" font-size="9" font-family="'Courier New', monospace">   57.5 30.1 136.8 124.1 107.3</text>
  <text x="758" y="668" fill="#64748b" font-size="9" font-family="'Courier New', monospace">$$ (3 компоненты: U/N/E)</text>
  <text x="758" y="690" fill="#fbbf24" font-size="9" font-style="italic">Амплитуды: метры · Фазы: градусы</text>
  <text x="758" y="706" fill="#fbbf24" font-size="9" font-style="italic">3 компоненты: вертикаль (U),</text>
  <text x="758" y="720" fill="#fbbf24" font-size="9" font-style="italic">север (N), восток (E)</text>
