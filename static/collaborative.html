<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Коллаборативное позиционирование — CPS</title>
<link rel="stylesheet" href="/css/theme.css">
<style>
.main-content { max-width:1000px; }

.page-eyebrow {
    font-family:var(--font-mono); font-size:0.7rem; font-weight:500;
    text-transform:uppercase; letter-spacing:0.18em; color:var(--ink-3);
    display:flex; align-items:center; gap:10px; margin-bottom:8px;
}
.page-eyebrow::before { content:''; width:24px; height:1px; background:var(--graphite); }
.page-title-row { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:28px; }
.page-title {
    font-size:1.9rem; font-weight:300; letter-spacing:-0.02em;
    color:var(--ink); margin-bottom:4px;
}
.page-title em { font-style:normal; background:var(--signal); color:var(--signal-ink); padding:0 6px; }
.page-subtitle { font-size:0.85rem; color:var(--ink-3); font-family:var(--font-mono); }
.page-back {
    background:var(--paper); border:1px solid var(--paper-edge); color:var(--ink);
    padding:8px 16px; border-radius:var(--r-sm); font-family:var(--font-sans);
    font-size:0.82rem; font-weight:500; cursor:pointer; transition:all var(--t); text-decoration:none;
    display:inline-flex; align-items:center; gap:6px;
}
.page-back:hover { background:var(--paper-2); border-color:var(--graphite); }

.card { padding:28px; margin-bottom:20px; }
.card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
.card-title {
    font-family:var(--font-mono); font-size:0.72rem; font-weight:600;
    text-transform:uppercase; letter-spacing:0.14em; color:var(--ink-3);
    display:flex; align-items:center; gap:10px;
}
.card-title::before {
    content:''; width:6px; height:6px; border-radius:50%;
    background:var(--signal); box-shadow:0 0 0 3px var(--signal-soft);
}

.devices-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
.device-card {
    background:var(--paper); border:1px solid var(--paper-edge);
    border-radius:var(--r-sm); padding:18px 16px;
    display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    position:relative; transition:all var(--t);
}
.device-card:hover { border-color:var(--graphite); background:var(--paper-2); }
.dev-icon { font-size:24px; }
.dev-name { font-size:0.95rem; font-weight:600; color:var(--ink); word-break:break-word; }
.dev-badges { display:flex; flex-wrap:wrap; gap:5px; }
.dev-desc { font-size:0.78rem; color:var(--ink-3); font-family:var(--font-mono); }
.dev-antenna { font-family:var(--font-mono); font-size:0.72rem; color:var(--graphite); word-break:break-all; }
[data-theme="dark"] .dev-antenna { color:var(--signal); }
.dev-antenna-label { font-family:var(--font-mono); font-size:0.66rem; color:var(--ink-faint); margin-bottom:1px; text-transform:uppercase; letter-spacing:0.1em; }
.dev-enu { font-size:0.7rem; color:var(--ink-3); font-family:var(--font-mono); }
.dev-pc { font-size:0.7rem; padding:2px 8px; border-radius:20px; display:inline-block; font-family:var(--font-mono); letter-spacing:0.02em; }
.dev-pc-ok      { background:var(--ok-bg); color:var(--ok); }
.dev-pc-expired { background:var(--warn-bg); color:var(--warn); }

.no-devices { text-align:center; padding:40px 20px; color:var(--ink-3); font-size:0.9rem; line-height:1.7; font-family:var(--font-mono); }
.no-devices .nd-icon { font-size:36px; display:block; margin-bottom:10px; }
.no-devices a { color:var(--graphite); font-weight:600; }
[data-theme="dark"] .no-devices a { color:var(--signal); }
.loading { text-align:center; padding:32px; color:var(--ink-3); font-size:0.9rem; font-family:var(--font-mono); }
</style>
</head>
<body class="bg-grid">
<header class="header">
    <div class="header-content">
        <a class="logo" href="/">
            <div class="logo-icon"></div>
            <div class="logo-text"></div>
        </a>
        <div class="user-menu">
            <button class="theme-toggle" onclick="_toggleTheme()" title="Тёмная тема">☾</button>
            <span class="user-name" id="headerLogin">—</span>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
    </div>
</header>
<main class="main-content">
    <div class="page-eyebrow"><span>SVC-C · Collaborative network</span></div>
    <div class="page-title-row">
        <div>
            <h1 class="page-title">Коллаборативное <em>позиционирование</em></h1>
            <div class="page-subtitle">Ваши устройства, участвующие в сети позиционирования</div>
        </div>
        <a class="page-back" href="/">← На главную</a>
    </div>
    <div class="card">
        <div class="card-header">
            <div class="card-title">Мои устройства</div>
            <button class="btn btn-primary" onclick="window.location.href='/profile'">＋ Управление устройствами</button>
        </div>
        <div id="devicesContent"><div class="loading">Загрузка…</div></div>
    </div>
</main>
<div class="toast" id="toast"></div>
<script src="/js/chrome.js"></script>
<script>
const DEVICE_ICONS  = { gnss_receiver:'📡', smartphone:'📱', tablet:'📟', other:'🔧' };
const DEVICE_LABELS = { gnss_receiver:'ГНСС-приёмник', smartphone:'Смартфон', tablet:'Планшет', other:'Иное' };
const MOUNT_LABELS  = { car:'Автомобиль', permanent_station:'Пост. станция', uav:'БПЛА', rod:'Веха', man:'Человек' };

function getToken()  { return localStorage.getItem('token'); }
function getLogin()  { return localStorage.getItem('userLogin') || ''; }
function logout()    { localStorage.removeItem('token'); localStorage.removeItem('userLogin'); window.location.href = '/'; }
function escHtml(s)  { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let _toastTimer;
function showToast(msg, type = 'ok') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `toast ${type} show`;
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { t.className = 'toast'; }, 3000);
}

function checkAuth() {
    if (!getToken() || !getLogin()) { window.location.href = '/login'; return false; }
    document.getElementById('headerLogin').textContent = getLogin();
    return true;
}

function renderDeviceExtra(d) {
    if (d.deviceType === 'gnss_receiver') {
        if (!d.antennaName) return '';
        const enu = (d.antennaE || d.antennaN || d.antennaU)
            ? `<div class="dev-enu">ENU: ${(+d.antennaE).toFixed(3)} / ${(+d.antennaN).toFixed(3)} / ${(+d.antennaU).toFixed(3)} м</div>`
            : '';
        return `<div class="dev-antenna-label">Антенна</div><div class="dev-antenna">${escHtml(d.antennaName)}</div>${enu}`;
    }
    if (d.phaseCenterMethod === 'auto' && d.phaseCenterValidUntil) {
        const until   = new Date(d.phaseCenterValidUntil);
        const expired = until < new Date();
        const fmt     = until.toLocaleString('ru', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
        return `<div class="dev-pc ${expired ? 'dev-pc-expired' : 'dev-pc-ok'}">${expired ? '⚠️ Калибровка истекла' : '🤖 Авто до ' + fmt}</div>`;
    }
    if (d.phaseCenterMethod === 'manual') {
        return `<div class="dev-enu">ENU: ${(+d.antennaE).toFixed(3)} / ${(+d.antennaN).toFixed(3)} / ${(+d.antennaU).toFixed(3)} м</div>`;
    }
    return '';
}

function renderDevices(devices) {
    const el = document.getElementById('devicesContent');
    if (!devices || devices.length === 0) {
        el.innerHTML = `<div class="no-devices">
            <span class="nd-icon">📡</span>
            Нет зарегистрированных устройств.<br>
            Добавьте устройство в <a href="/profile">личном кабинете</a>.
        </div>`;
        return;
    }
    el.innerHTML = `<div class="devices-grid">${devices.map(d => `
        <div class="device-card">
            <span class="dev-icon">${DEVICE_ICONS[d.deviceType] || '🔧'}</span>
            <div class="dev-name">${escHtml(d.name)}</div>
            <div class="dev-badges">
                <span class="badge badge-type">${DEVICE_LABELS[d.deviceType] || d.deviceType}</span>
                <span class="badge badge-mount">${MOUNT_LABELS[d.mountType] || d.mountType}</span>
            </div>
            ${renderDeviceExtra(d)}
            ${d.description ? `<div class="dev-desc">${escHtml(d.description)}</div>` : ''}
        </div>`).join('')}
    </div>`;
}

async function loadDevices() {
    try {
        const r = await fetch('/api/profile/data', { headers: { 'Authorization': `Bearer ${getToken()}` } });
        if (!r.ok) { showToast('Ошибка загрузки данных', 'err'); return; }
        const data = await r.json();
        renderDevices(data.devices || []);
    } catch { showToast('Ошибка соединения', 'err'); }
}

document.addEventListener('DOMContentLoaded', () => {
    if (!checkAuth()) return;
    loadDevices();
});
</script>
</body>
</html>
