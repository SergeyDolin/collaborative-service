<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Позиционирование — CPS</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://tile0.maps.2gis.com">
<style>
html, body { height:100%; margin:0; padding:0; overflow:hidden; }
body { display:flex; flex-direction:column; }
.header { flex-shrink:0; position:relative; z-index:10; }

/* Top bar */
.pos-topbar {
    flex-shrink:0; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:10px 24px; border-bottom:1px solid var(--paper-edge);
    background:var(--paper); z-index:10;
}
.pos-back {
    background:var(--paper-2); border:1px solid var(--paper-edge); color:var(--ink);
    padding:6px 14px; border-radius:var(--r-sm); font-size:0.8rem; font-weight:500;
    cursor:pointer; transition:all var(--t); text-decoration:none;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.pos-back:hover { background:var(--paper-edge); }
.pos-device-name { font-size:1rem; font-weight:600; color:var(--ink); }
.pos-device-type  { font-size:0.75rem; color:var(--ink-3); font-family:var(--font-mono); }
.pos-status-badge {
    margin-left:auto; padding:5px 14px; border-radius:20px;
    font-family:var(--font-mono); font-size:0.75rem; font-weight:600;
    display:flex; align-items:center; gap:7px;
}
.status-idle    { background:var(--paper-2); color:var(--ink-3); border:1px solid var(--paper-edge); }
.status-running { background:var(--ok-bg,#e6faf0); color:var(--ok,#1db954); border:1px solid var(--ok,#1db954); }
.status-running .pulse {
    width:7px; height:7px; border-radius:50%; background:var(--ok,#1db954);
    animation:pulseAnim 1.4s infinite;
}
@keyframes pulseAnim {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:.5; transform:scale(1.5); }
}
.status-stopped { background:var(--warn-bg,#fff8e1); color:var(--warn,#f5a623); border:1px solid var(--warn,#f5a623); }

/* Map wrapper stretches to fill remaining height */
.map-wrapper { flex:1; position:relative; min-height:0; }
#map { width:100%; height:100%; }

/* Info overlay */
.map-info-overlay {
    position:absolute; bottom:80px; left:16px; z-index:500;
    background:var(--paper); border:1px solid var(--paper-edge);
    border-radius:var(--r-sm); padding:12px 16px; min-width:260px;
    box-shadow:0 4px 20px rgba(0,0,0,.12);
    font-family:var(--font-mono); font-size:0.78rem; pointer-events:none;
}
[data-theme="dark"] .map-info-overlay { box-shadow:0 4px 20px rgba(0,0,0,.4); }
.map-info-row { display:flex; justify-content:space-between; gap:16px; margin-bottom:5px; }
.map-info-row:last-child { margin-bottom:0; }
.mi-label { color:var(--ink-3); }
.mi-val   { color:var(--ink); font-weight:600; }
.mi-quality-fix    { color:var(--ok,#1db954); }
.mi-quality-float  { color:var(--warn,#f5a623); }
.mi-quality-single { color:var(--ink-3); }
.map-info-overlay.hidden { display:none; }

/* Waiting overlay (shown when positioning is on but no position yet) */
.map-wait-overlay {
    position:absolute; inset:0; z-index:400;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(var(--paper-rgb,255,255,255),.7);
    font-family:var(--font-mono); font-size:0.85rem; color:var(--ink-3); gap:12px;
}
[data-theme="dark"] .map-wait-overlay { background:rgba(20,20,20,.7); }
.map-wait-overlay.hidden { display:none; }
.wait-spinner {
    width:28px; height:28px; border:3px solid var(--paper-edge);
    border-top-color:var(--signal); border-radius:50%;
    animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* Bottom controls */
.pos-controls {
    flex-shrink:0; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:12px 24px; border-top:1px solid var(--paper-edge); background:var(--paper); z-index:10;
}
.pos-hint { font-family:var(--font-mono); font-size:0.8rem; color:var(--ink-3); flex:1; }

/* Position dot marker */
.pos-dot {
    width:14px; height:14px; border-radius:50%;
    border:2px solid #fff; box-shadow:0 0 0 2px rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.3);
}
.pos-dot-fix    { background:#1db954; }
.pos-dot-float  { background:#f5a623; }
.pos-dot-single { background:#e74c3c; }
</style>
</head>
<body class="bg-grid">

<header class="header">
    <div class="header-content">
        <a class="logo" href="/"><div class="logo-icon"></div><div class="logo-text"></div></a>
        <div class="user-menu">
            <button class="theme-toggle" onclick="_toggleTheme()" title="Тёмная тема" data-icon="moon" data-icon-size="16"></button>
            <span class="user-name" id="headerLogin">—</span>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
    </div>
</header>

<div class="pos-topbar">
    <a class="pos-back" href="/collaborative">← Назад</a>
    <div>
        <div class="pos-device-name" id="deviceName">Устройство</div>
        <div class="pos-device-type" id="deviceType"></div>
    </div>
    <div class="pos-status-badge status-idle" id="statusBadge">
        <span>Ожидание</span>
    </div>
</div>

<div class="map-wrapper">
    <div id="map"></div>

    <!-- Оверлей ожидания первого решения -->
    <div class="map-wait-overlay hidden" id="waitOverlay">
        <div class="wait-spinner"></div>
        <span>Ожидание первого решения от rtkrcv…</span>
    </div>

    <!-- Инфопанель с координатами -->
    <div class="map-info-overlay hidden" id="infoOverlay">
        <div class="map-info-row"><span class="mi-label">Широта</span><span class="mi-val" id="infoLat">—</span></div>
        <div class="map-info-row"><span class="mi-label">Долгота</span><span class="mi-val" id="infoLon">—</span></div>
        <div class="map-info-row"><span class="mi-label">Высота</span><span class="mi-val" id="infoHeight">—</span></div>
        <div class="map-info-row"><span class="mi-label">Спутники</span><span class="mi-val" id="infoNsat">—</span></div>
        <div class="map-info-row"><span class="mi-label">Качество</span><span class="mi-val" id="infoQuality">—</span></div>
        <div class="map-info-row"><span class="mi-label">Обновлено</span><span class="mi-val" id="infoAge">—</span></div>
    </div>
</div>

<div class="pos-controls">
    <span class="pos-hint" id="controlHint">Нажмите «Старт» для запуска позиционирования</span>
    <button class="btn btn-secondary" id="btnStop"  onclick="stopPositioning()"  style="display:none">■ Стоп</button>
    <button class="btn btn-primary"   id="btnStart" onclick="startPositioning()">▶ Старт</button>
</div>

<div class="toast" id="toast"></div>
<script src="/js/icons.js"></script>
<script src="/js/chrome.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Auth ─────────────────────────────────────────────────────────────────────
function getToken() { return localStorage.getItem('token'); }
function getLogin() { return localStorage.getItem('userLogin') || ''; }
function logout()   { localStorage.removeItem('token'); localStorage.removeItem('userLogin'); location.href = '/'; }

let _toastTimer;
function showToast(msg, type = 'ok') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `toast ${type} show`;
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { t.className = 'toast'; }, 3500);
}
function checkAuth() {
    if (!getToken() || !getLogin()) { location.href = '/login'; return false; }
    document.getElementById('headerLogin').textContent = getLogin();
    return true;
}

// ── Constants & state ─────────────────────────────────────────────────────────
const deviceId = parseInt(new URLSearchParams(location.search).get('deviceId')) || 0;
if (!deviceId) location.href = '/collaborative';

let currentSession = null;
let pollTimer      = null;
let posMarker      = null;
let accCircle      = null;
let mapCentred     = false;

const QUALITY_CLASS = { 1:'fix', 2:'float', 5:'single' };
const QUALITY_LABEL = { 1:'Fix', 2:'Float', 5:'Single' };
const QUALITY_COLOR = { 1:'#1db954', 2:'#f5a623', 5:'#e74c3c' };
const DEVICE_LABELS = { gnss_receiver:'ГНСС-приёмник', smartphone:'Смартфон', tablet:'Планшет', other:'Иное' };

// ── Leaflet map ───────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl:true }).setView([55.75, 37.62], 5);
L.tileLayer('https://tile{s}.maps.2gis.com/tiles?x={x}&y={y}&z={z}&v=1.3', {
    subdomains: ['0', '1', '2', '3'],
    maxZoom: 18,
    attribution: '© <a href="https://2gis.ru">2ГИС</a>',
}).addTo(map);

delete L.Icon.Default.prototype._getIconUrl;
L.Icon.Default.mergeOptions({
    iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
    iconUrl:       'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
    shadowUrl:     'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
});

function makeDotIcon(quality) {
    return L.divIcon({
        className: '',
        html: `<div class="pos-dot pos-dot-${QUALITY_CLASS[quality] || 'single'}"></div>`,
        iconSize: [14, 14], iconAnchor: [7, 7],
    });
}

function updateMapPosition(pos) {
    const latlng = [pos.lat, pos.lon];
    const color  = QUALITY_COLOR[pos.quality] || QUALITY_COLOR[5];
    const radius = Math.max(5, (pos.pdop || 3) * 4);

    if (posMarker) { posMarker.setLatLng(latlng).setIcon(makeDotIcon(pos.quality)); }
    else           { posMarker = L.marker(latlng, { icon: makeDotIcon(pos.quality) }).addTo(map); }

    if (accCircle) { accCircle.setLatLng(latlng).setRadius(radius).setStyle({ color, fillColor: color }); }
    else           { accCircle = L.circle(latlng, { radius, color, fillColor: color, fillOpacity: 0.15, weight: 1.5 }).addTo(map); }

    if (!mapCentred) { map.setView(latlng, 16); mapCentred = true; }
}

function updateInfoOverlay(pos) {
    const overlay = document.getElementById('infoOverlay');
    if (!pos) { overlay.classList.add('hidden'); return; }
    const ago    = Math.round((Date.now() - new Date(pos.updatedAt)) / 1000);
    const qClass = 'mi-quality-' + (QUALITY_CLASS[pos.quality] || 'single');
    document.getElementById('infoLat').textContent    = pos.lat.toFixed(8) + '°';
    document.getElementById('infoLon').textContent    = pos.lon.toFixed(8) + '°';
    document.getElementById('infoHeight').textContent = pos.height.toFixed(3) + ' м';
    document.getElementById('infoNsat').textContent   = pos.nsat;
    document.getElementById('infoQuality').innerHTML  = `<span class="${qClass}">${QUALITY_LABEL[pos.quality] || pos.quality}</span>`;
    document.getElementById('infoAge').textContent    = ago + ' с назад';
    overlay.classList.remove('hidden');
}

// ── Session ───────────────────────────────────────────────────────────────────
async function loadSession() {
    try {
        const r = await fetch('/api/collaborative/sessions', { headers: { 'Authorization': `Bearer ${getToken()}` } });
        if (!r.ok) return null;
        const list = await r.json();
        return (list || []).find(s => s.deviceId === deviceId) || null;
    } catch { return null; }
}

async function loadDevice() {
    try {
        const r = await fetch('/api/profile/data', { headers: { 'Authorization': `Bearer ${getToken()}` } });
        if (!r.ok) return;
        const data = await r.json();
        const dev = (data.devices || []).find(d => d.id === deviceId);
        if (dev) {
            document.getElementById('deviceName').textContent = dev.name;
            document.getElementById('deviceType').textContent = DEVICE_LABELS[dev.deviceType] || dev.deviceType;
            document.title = dev.name + ' — CPS';
        }
    } catch {}
}

// ── UI state ──────────────────────────────────────────────────────────────────
function applySessionState(sess) {
    currentSession = sess;
    const badge    = document.getElementById('statusBadge');
    const btnStart = document.getElementById('btnStart');
    const btnStop  = document.getElementById('btnStop');
    const hint     = document.getElementById('controlHint');
    const waitOvl  = document.getElementById('waitOverlay');

    if (!sess) {
        badge.className = 'pos-status-badge status-idle';
        badge.innerHTML = '<span>Нет сессии</span>';
        btnStart.style.display = 'none'; btnStop.style.display = 'none';
        hint.innerHTML = 'Сессия не настроена. <a href="/collaborative" style="color:var(--signal)">Вернитесь на страницу подключений</a>.';
        waitOvl.classList.add('hidden');
        updateInfoOverlay(null);
        return;
    }

    if (sess.enablePositioning) {
        badge.className = 'pos-status-badge status-running';
        badge.innerHTML = '<div class="pulse"></div><span>Идёт позиционирование</span>';
        btnStart.style.display = 'none'; btnStop.style.display = '';
        if (sess.latestPosition) {
            waitOvl.classList.add('hidden');
            hint.textContent = 'Позиция обновляется каждые 30 с';
            updateMapPosition(sess.latestPosition);
            updateInfoOverlay(sess.latestPosition);
        } else {
            waitOvl.classList.remove('hidden');
            hint.textContent = 'Ожидание первого решения от rtkrcv…';
            updateInfoOverlay(null);
        }
    } else {
        badge.className = 'pos-status-badge status-stopped';
        badge.innerHTML = '<span>Остановлено</span>';
        btnStart.style.display = ''; btnStop.style.display = 'none';
        waitOvl.classList.add('hidden');
        hint.textContent = 'Нажмите «Старт» для возобновления позиционирования';
        if (sess.latestPosition) {
            updateMapPosition(sess.latestPosition);
            updateInfoOverlay(sess.latestPosition);
        }
    }
}

// ── Polling ───────────────────────────────────────────────────────────────────
function startPoll() {
    if (pollTimer) return;
    pollTimer = setInterval(async () => {
        applySessionState(await loadSession());
    }, 5000);
}
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

// ── Controls ──────────────────────────────────────────────────────────────────
async function startPositioning() {
    const sess = currentSession || await loadSession();
    if (!sess) { location.href = '/collaborative'; return; }

    document.getElementById('btnStart').disabled = true;
    try {
        const r = await fetch(`/api/collaborative/sessions/${sess.id}/positioning`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled: true }),
        });
        const data = await r.json();
        if (!r.ok) { showToast(data.error || 'Ошибка', 'err'); return; }
        showToast('Позиционирование запущено', 'ok');
        applySessionState(await loadSession());
        startPoll();
    } catch { showToast('Ошибка соединения', 'err'); }
    finally   { document.getElementById('btnStart').disabled = false; }
}

async function stopPositioning() {
    if (!currentSession) return;
    document.getElementById('btnStop').disabled = true;
    try {
        const r = await fetch(`/api/collaborative/sessions/${currentSession.id}/positioning`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled: false }),
        });
        const data = await r.json();
        if (!r.ok) { showToast(data.error || 'Ошибка', 'err'); return; }
        showToast('Позиционирование остановлено', 'ok');
        stopPoll();
        applySessionState(await loadSession());
    } catch { showToast('Ошибка соединения', 'err'); }
    finally   { document.getElementById('btnStop').disabled = false; }
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
    if (!checkAuth()) return;
    await loadDevice();
    const sess = await loadSession();
    applySessionState(sess);
    if (sess && sess.enablePositioning) startPoll();
});
</script>
</body>
</html>
