# rtkrcv config — RTK с кандидатом как базовой станцией
# Шаблоны: {{ROVER_TYPE}}, {{ROVER_PATH}}, {{SOL_FILE}}, {{ATX_FILE}}
#           {{BASE_HOST}}, {{BASE_PORT}}, {{EPH_HOST}}, {{EPH_PORT}}

# --- Входные потоки ---
# Поток 1: измерения от ГНСС-приёмника пользователя (ровер)
inpstr1-type       ={{ROVER_TYPE}}
inpstr1-path       ={{ROVER_PATH}}
inpstr1-format     =rtcm3

# Поток 2: RTCM-измерения кандидата (база)
inpstr2-type       =tcpcli
inpstr2-path       ={{BASE_HOST}}:{{BASE_PORT}}
inpstr2-format     =rtcm3

# Поток 3: эфемериды через TCP-прокси сервиса
inpstr3-type       =tcpcli
inpstr3-path       ={{EPH_HOST}}:{{EPH_PORT}}
inpstr3-format     =rtcm3

inpstr4-type       =tcpcli
inpstr4-path       ={{SSR_HOST}}:{{SSR_PORT}}
inpstr4-format     =rtcm3

# --- Выходные потоки ---
outstr1-type       =file
outstr1-path       ={{SOL_FILE}}
outstr1-format     =llh

outstr2-type       =off

# --- Параметры позиционирования ---
pos1-posmode       =kinematic
pos1-frequency     =l1+l2+l5
pos1-elmask        =10
pos1-ionoopt       =brdc
pos1-tropopt       =est-ztd
pos1-sateph        =brdc+ssrapc
pos1-navsys        =255

pos2-armode        =continuous
pos2-arfilter      =on
pos2-gloarmode     =on
pos2-bdsarmode     =on
pos2-arthres       =3
pos2-arthres1      =0.95
pos2-arthres2      =0.25
pos2-maxage        =30
pos2-slipthres     =0.05

# --- Параметры решения ---
out-solformat      =llh
out-timesys        =utc
out-timeform       =hms
out-timendec       =3
out-degform        =deg
out-height         =ellipsoidal
out-outsingle      =on

stats-eratio1      =100
stats-eratio2      =100
stats-errphase     =0.003
stats-errphaseel   =0.003
stats-prnaccelh    =10
stats-prnaccelv    =10

ant1-postype       =single
ant1-anttype       ={{ANT_TYPE}}
ant1-antdelu       ={{ANT_U}}
ant1-antdele       ={{ANT_E}}
ant1-antdeln       ={{ANT_N}}
ant2-postype       =rtcm

file-satantfile    ={{ATX_FILE}}
file-rcvantfile    ={{ATX_FILE}}

# --- Misc ---
misc-svrcycle      =10
misc-timeout       =10000
misc-reconnect     =10000
misc-buffsize      =32768
misc-navmsgsel     =all
