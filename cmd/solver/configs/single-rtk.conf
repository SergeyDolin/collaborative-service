# rtkrcv configuration — single point positioning
# Шаблон: {{ROVER_TYPE}}, {{ROVER_PATH}}, {{SOL_FILE}}, {{ATX_FILE}} заменяются при запуске

# --- Входные потоки ---
# Поток 1: измерения непосредственно от устройства пользователя
inpstr1-type       ={{ROVER_TYPE}}
inpstr1-path       ={{ROVER_PATH}}
inpstr1-format     =rtcm3

# Поток 2: эфемериды IGS по NTRIP
inpstr2-type       =ntripcli
inpstr2-path       =Dolin:SergeySGGABG12@products.igs-ip.net:2101/BCEP00BKG0
inpstr2-format     =rtcm3

# --- Выходной поток: решение ---
outstr1-type       =file
outstr1-path       ={{SOL_FILE}}
outstr1-format     =llh

# --- Параметры позиционирования ---
pos1-posmode       =single
pos1-frequency     =l1+l2+l5
pos1-elmask        =10
pos1-ionoopt       =brdc
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-navsys        =61

# --- Параметры решения ---
out-solformat      =llh
out-timesys        =utc
out-timeform       =hms
out-timendec       =3
out-degform        =deg
out-height         =ellipsoidal
out-outsingle      =on

# --- Прочие ---
stats-eratio1      =100
stats-eratio2      =100
stats-errphase     =0.003
stats-errphaseel   =0.003
stats-prnaccelh    =10
stats-prnaccelv    =10

ant1-postype       =single
ant1-anttype       =*

file-satantfile    ={{ATX_FILE}}
file-rcvantfile    ={{ATX_FILE}}
